<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI answer review study</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f6f7; --surface:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d9e0e5;
  --hi:#0f6b6b; --hi-bg:#e3f1f0;
  --mid:#9a6408; --mid-bg:#fbf0d9;
  --lo:#b12f42; --lo-bg:#fbe3e6;
  --accent:#1b2430; --accent-ink:#ffffff; --focus:#2557d6; --linkc:#2557d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --surface:#1a2129; --ink:#e7ecf0; --muted:#95a3b1; --line:#2c3743;
    --hi:#5cc7c1; --hi-bg:#15302f; --mid:#e6b04c; --mid-bg:#33290f; --lo:#f0808f; --lo-bg:#3a1a20;
    --accent:#e7ecf0; --accent-ink:#12171d; --focus:#8fb0ff; --linkc:#8fb0ff;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e7ecf0; --muted:#95a3b1; --line:#2c3743;
  --hi:#5cc7c1; --hi-bg:#15302f; --mid:#e6b04c; --mid-bg:#33290f; --lo:#f0808f; --lo-bg:#3a1a20;
  --accent:#e7ecf0; --accent-ink:#12171d; --focus:#8fb0ff; --linkc:#8fb0ff;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 72px}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 20px;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:.85rem}
label.row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:10px 0}
label.row input{margin-top:4px}
.field{margin:14px 0}
.field>span{display:block;font-weight:600;margin-bottom:6px;font-size:.92rem}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
.field textarea{min-height:76px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{flex:1 1 110px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 8px;cursor:pointer;font-size:.86rem;line-height:1.25}
.opts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface);font-weight:600}
.opts.likert button{flex:1 1 60px}
.lk-ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:4px}
details.researcher{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;font-size:.88rem}
details summary{cursor:pointer;color:var(--muted)}

.qtext{font-family:"Source Serif 4",Georgia,serif;font-size:1.2rem;line-height:1.5;margin:0 0 4px}
.task{background:var(--bg);border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.9rem}
.answer{font-family:"Source Serif 4",Georgia,serif;font-size:1.1rem;line-height:1.85;margin:0 0 18px}
.sent.mk.hi{text-decoration:underline solid color-mix(in srgb,var(--hi) 45%,transparent);text-decoration-thickness:1.5px;text-underline-offset:5px}
.sent.mk.mid{background:var(--mid-bg);text-decoration:underline dashed var(--mid);text-decoration-thickness:1.5px;text-underline-offset:5px}
.sent.mk.lo{background:var(--lo-bg);text-decoration:underline wavy var(--lo);text-decoration-thickness:1.5px;text-underline-offset:5px}
.fullans{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.fullans summary{cursor:pointer;font-weight:600;font-size:.9rem}
.fullans .answer{margin:12px 0 4px;font-size:1rem;line-height:1.8}

.claim{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.claim.hi.lbl{border-left-color:var(--hi)}
.claim.mid.lbl{border-left-color:var(--mid)}
.claim.lo.lbl{border-left-color:var(--lo)}
.ctext{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.6;margin:0 0 10px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;margin:0 8px 0 6px;font-variant-numeric:tabular-nums;vertical-align:.1em;font-family:Figtree,system-ui,sans-serif;line-height:1.4}
.claim .tag{margin-left:0}
.tag.hi{color:var(--hi);background:var(--hi-bg)}
.tag.mid{color:var(--mid);background:var(--mid-bg)}
.tag.lo{color:var(--lo);background:var(--lo-bg)}
.dec{display:flex;flex-wrap:wrap;gap:6px}
.dec button{flex:1 1 130px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.85rem}
.dec button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.dec a.opt{flex:1 1 130px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.85rem;text-align:center;text-decoration:none;color:inherit;display:block}
.dec a.opt.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.smallbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.83rem;margin-left:4px}
.copied{margin-left:8px;font-size:.83rem;color:var(--muted)}
.checkbox-area{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.88rem}
.checkbox-area a{color:var(--linkc);font-weight:600}
.after{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.after span{margin-right:4px}
.after button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.83rem}
.after button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface);font-weight:600}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}

.err-item{border-left:4px solid var(--lo);padding:8px 0 8px 14px;margin:14px 0}
.err-item .ctext{margin-bottom:4px}
.badge{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);margin-right:6px;display:inline-block;margin-top:4px}
.badge.bad{color:var(--lo);background:var(--lo-bg);border-color:transparent}
.badge.good{color:var(--hi);background:var(--hi-bg);border-color:transparent}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stat div{flex:1 1 140px;background:var(--bg);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
textarea.export{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.notice{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- Study content (ground truth is in `err`; claims are in reading order) ---------- */
const TOPICS = [
  { id:"sql", label:"SQL",
    q:"Explain the difference between WHERE and HAVING in SQL, and how INNER JOIN and LEFT JOIN work.",
    claims:[
      {id:"sql1", c:96, err:false, t:"WHERE filters individual rows before any grouping takes place."},
      {id:"sql2", c:95, err:false, t:"HAVING filters groups after GROUP BY has been applied, so it can use aggregate functions such as COUNT or SUM."},
      {id:"sql3", c:62, err:true,  t:"COUNT(column_name) counts every row in the table, including rows where that column is NULL.",
        fix:"COUNT(column_name) ignores NULL values in that column. COUNT(*) is the version that counts all rows."},
      {id:"sql4", c:94, err:false, t:"An INNER JOIN returns only the rows that have matching values in both tables."},
      {id:"sql5", c:87, err:true,  t:"A LEFT JOIN returns all rows from the right table, together with the matching rows from the left table.",
        fix:"A LEFT JOIN returns all rows from the left table, together with the matching rows from the right table (with NULLs where there is no match)."},
      {id:"sql6", c:68, err:false, t:"Indexes usually speed up reads on the indexed columns but add some cost to inserts and updates."}
    ]},
  { id:"ba", label:"Business analysis",
    q:"Explain what a business analyst does, and describe requirement types, SWOT analysis, requirement prioritisation and final testing of a solution.",
    claims:[
      {id:"ba1", c:95, err:false, t:"A business analyst identifies business needs and recommends solutions, acting as a link between stakeholders and the delivery team."},
      {id:"ba2", c:96, err:false, t:"A functional requirement describes what a system should do, for example letting a customer reset their password."},
      {id:"ba3", c:94, err:false, t:"A non-functional requirement describes how well the system should perform, such as its response time, security or usability."},
      {id:"ba4", c:89, err:true,  t:"In a SWOT analysis, strengths and opportunities are internal factors, while weaknesses and threats come from outside the organisation.",
        fix:"Strengths and weaknesses are internal factors. Opportunities and threats are external factors."},
      {id:"ba5", c:69, err:false, t:"The MoSCoW method prioritises requirements as Must have, Should have, Could have and Won't have (this time)."},
      {id:"ba6", c:60, err:true,  t:"User acceptance testing is normally carried out by the developers who built the solution.",
        fix:"User acceptance testing is normally carried out by the business users or stakeholders who will use the solution, not by the developers who built it."}
    ]},
  { id:"hist", label:"History",
    q:"What led to the First World War, and how did it unfold from 1914 to 1917?",
    claims:[
      {id:"hist1", c:97, err:false, t:"Archduke Franz Ferdinand was assassinated in Sarajevo on 28 June 1914."},
      {id:"hist2", c:57, err:true,  t:"Historians broadly agree that the alliance system alone caused the war.",
        fix:"Historians debate the causes and weigh several factors, including militarism, nationalism, imperial rivalry and diplomacy. There is no consensus that alliances alone caused the war."},
      {id:"hist3", c:68, err:false, t:"Austria-Hungary's July 1914 ultimatum to Serbia was worded so that Serbia could not accept it in full."},
      {id:"hist4", c:92, err:false, t:"Germany's Schlieffen Plan required an advance through neutral Belgium."},
      {id:"hist5", c:91, err:false, t:"Britain declared war on Germany on 4 August 1914, after German forces invaded Belgium."},
      {id:"hist6", c:86, err:true,  t:"The United States entered the war in 1915, immediately after the sinking of the Lusitania.",
        fix:"The United States entered the war in April 1917. The Lusitania was sunk in May 1915."}
    ]}
];
const FAM = ["Never heard of it","Vaguely familiar","Somewhat","Quite familiar","I know this well"];
const DECS = [{k:"accept", l:"Accept as is"},{k:"check_later", l:"I would check this by myself later"},{k:"check_now", l:"I want to check this now, take me to Google"},{k:"wrong", l:"I think this is wrong"}];
const AFTER = [{k:"correct", l:"Correct"},{k:"wrong", l:"Wrong"},{k:"unsure", l:"Not sure"}];
const LIKERT = ["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
const USAGE = ["Never","A few times a term","Weekly","Most days"];
const SURVEY_Q = [
  {k:"sure",   l:"I felt sure about my decisions.", conds:["A","B","C"]},
  {k:"google", l:"Being able to jump straight to Google helped me check a sentence.", conds:["A","B","C"]},
  {k:"trust",  l:"I trusted the confidence labels.", conds:["B","C"]},
  {k:"changed",l:"The labels changed which sentences I chose to check.", conds:["B","C"]},
  {k:"precise",l:"The exact percentages felt more precise than they could really be.", conds:["B"]},
  {k:"use",    l:"I would use answers presented this way for my coursework.", conds:["A","B","C"]}
];
const FIXED_COND = "C";
// After you deploy the Google Apps Script, paste its Web app URL between the quotes.
// Leave it empty to turn automatic sending off (participants then save a file instead).
const ENDPOINT = "";
// Optional: your contact details, shown in the consent text, e.g. "Contact: name@university.edu".
const CONTACT = "";
const KEY = "conf-study-v3-C";
const PH = ["fam","read","judge"];

/* ---------- State ---------- */
const fresh = () => ({
  stage:"intro", pid:"P-"+Math.random().toString(36).slice(2,6).toUpperCase(),
  cond:null, override:"random", consent:false, usage:null,
  ti:0, phase:"fam", fam:{}, dec:{}, tStart:{}, tJudge:{}, tEnd:{}, survey:{}, open:"",
  startedAt:null, finishedAt:null, resetArm:false, submissionId:null, submit:"idle"
});
let S = fresh();
try { const r = localStorage.getItem(KEY); if(r){ const p = JSON.parse(r); if(p && p.stage) S = Object.assign(fresh(), p, {resetArm:false}); } } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tier = c => c>=85?"hi":c>=70?"mid":"lo";
const tierName = {hi:"High",mid:"Medium",lo:"Low"};
const totalSteps = TOPICS.length*3 + 2;
const stepNow = () => S.stage==="intro"?0 : S.stage==="topic"? 1+S.ti*3+PH.indexOf(S.phase) : S.stage==="survey"? totalSteps-1 : totalSteps;
const CLAIMS = Object.fromEntries(TOPICS.flatMap(t=>t.claims.map(c=>[c.id,{...c,topic:t.id}])));
const searchUrl = id => "https://www.google.com/search?q="+encodeURIComponent(CLAIMS[id].t);

function labelFor(c){
  if(S.cond==="B") return `<span class="tag ${tier(c.c)}" aria-label="AI confidence ${c.c} percent">AI confidence: ${c.c}%</span>`;
  if(S.cond==="C") return `<span class="tag ${tier(c.c)}">AI confidence: ${tierName[tier(c.c)]}</span>`;
  return "";
}
function fullAnswerHtml(T){
  return `<div class="answer">`+T.claims.map(c=>{
    const cls = S.cond==="A" ? "" : ` mk ${tier(c.c)}`;
    return `<span class="sent${cls}">${esc(c.t)}</span>${labelFor(c)||" "}`;
  }).join("")+`</div>`;
}
function progressBar(){
  const s = stepNow(), pct = Math.round(s/totalSteps*100);
  return `<div class="progress"><span>Participant ${esc(S.pid)}</span><span>${pct}% complete</span></div><div class="pbar"><i style="width:${pct}%"></i></div>`;
}

/* ---------- Screens ---------- */
function screenIntro(){
  return `<h1>How do you review an AI answer?</h1>
  <p class="muted">A short study, about 10 minutes. You will read three AI answers to study questions (SQL, business analysis and history). For each one you first read the whole answer, then decide what you would do with each sentence before using it in an assignment.</p>
  <div class="panel">
    <h2>Before you start</h2>
    <p class="small">Some sentences in these answers are deliberately wrong. Any confidence labels shown were written by the researchers for this study and are not calculated by a real AI. If you choose "I want to check this now", a Google search for that sentence opens in a new tab so you can look it up. ${dataNote()}</p>
    <label class="row"><input type="checkbox" id="consent" ${S.consent?"checked":""}><span>I understand this and agree to take part. I can stop at any time.</span></label>
    <div class="field"><span>How often do you use generative AI for coursework?</span>
      <div class="opts" role="group" aria-label="AI use">${USAGE.map((u,i)=>`<button data-u="${i}" aria-pressed="${S.usage===i}">${u}</button>`).join("")}</div>
    </div>
    <div class="field"><span>Participant ID</span><input type="text" id="pid" value="${esc(S.pid)}" maxlength="20"><p class="small muted" style="margin:6px 0 0">Use the ID the researcher gave you, or keep the one shown.</p></div>
    <button class="primary" id="start" ${S.consent&&S.usage!==null?"":"disabled"}>Start</button>
  </div>`;
}
function screenFam(){
  const T = TOPICS[S.ti];
  return `<div class="panel">
    <p class="small muted">Question ${S.ti+1} of ${TOPICS.length}</p>
    <p class="qtext">${esc(T.q)}</p>
    <div class="task">Before you see the AI's answer: how well do you feel you already know this topic?</div>
    <div class="opts" role="group" aria-label="Familiarity">${FAM.map((l,i)=>`<button data-f="${i+1}" aria-pressed="${S.fam[T.id]===i+1}"><b>${i+1}</b><br>${l}</button>`).join("")}</div>
    <div class="bottom"><span></span><button class="primary" id="seeAns" ${S.fam[T.id]?"":"disabled"}>Show the answer</button></div>
  </div>`;
}
function screenRead(){
  const T = TOPICS[S.ti];
  return `<div class="panel">
    <p class="small muted">Question ${S.ti+1} of ${TOPICS.length}</p>
    <p class="qtext">${esc(T.q)}</p>
    <div class="task"><b>Step 1: read the whole answer.</b> Take your time. On the next screen you will go through it one sentence at a time.</div>
    ${fullAnswerHtml(T)}
    <div class="bottom"><span></span><button class="primary" id="startJudge">I have read it, start judging</button></div>
  </div>`;
}
function screenJudge(){
  const T = TOPICS[S.ti];
  const ids = T.claims.map(c=>c.id);
  const done = ids.filter(id=>S.dec[id] && S.dec[id].d).length;
  const last = S.ti===TOPICS.length-1;
  let h = `<p class="small muted">Question ${S.ti+1} of ${TOPICS.length}</p>
    <p class="qtext">${esc(T.q)}</p>
    <div class="task"><b>Step 2: judge each sentence.</b> Imagine you are about to use this answer in an assignment. Choose what you would do with each sentence.</div>
    <details class="fullans"><summary>Show the full answer again</summary>${fullAnswerHtml(T)}</details>`;
  ids.forEach(id=>{
    const c = CLAIMS[id], dd = S.dec[id]||{}, d = dd.d;
    const lbl = S.cond==="A" ? "" : ` ${tier(c.c)} lbl`;
    h += `<div class="claim${lbl}"><p class="ctext">${labelFor(c)}${esc(c.t)}</p>
      <div class="dec" role="group" aria-label="Decision for this sentence">${DECS.map(o=> o.k==="check_now"
        ? `<a class="opt${d===o.k?" on":""}" href="${searchUrl(id)}" target="_blank" rel="noopener noreferrer" data-c="${id}" data-d="${o.k}">${o.l}</a>`
        : `<button data-c="${id}" data-d="${o.k}" aria-pressed="${d===o.k}">${o.l}</button>`).join("")}</div>`;
    if(d==="check_now"){
      h += `<div class="checkbox-area">Google should have opened in a new tab. If you see a blank page or nothing opens, <a href="${searchUrl(id)}" target="_blank" rel="noopener noreferrer" data-g="${id}">try this link</a>, or <button class="smallbtn" data-copy="${id}">copy the sentence</button><span class="copied" id="cp-${id}" aria-live="polite"></span> and search it yourself.
        <div class="after" role="group" aria-label="After checking"><span>After looking it up, this sentence is (optional):</span>
        ${AFTER.map(o=>`<button data-a="${id}" data-v="${o.k}" aria-pressed="${dd.after===o.k}">${o.l}</button>`).join("")}</div></div>`;
    }
    h += `</div>`;
  });
  h += `<div class="bottom"><span class="small muted">${done} of ${ids.length} sentences decided</span>
    <button class="primary" id="nextQ" ${done===ids.length?"":"disabled"}>${last?"Continue to questions":"Next question"}</button></div>`;
  return h;
}
function screenSurvey(){
  const qs = SURVEY_Q.filter(q=>q.conds.includes(S.cond));
  let h = `<h1>Two minutes of feedback</h1><p class="muted">Almost done.</p><div class="panel">`;
  qs.forEach(q=>{
    h += `<div class="field"><span>${esc(q.l)}</span>
      <div class="opts likert" role="group" aria-label="${esc(q.l)}">${LIKERT.map((l,i)=>`<button data-s="${q.k}" data-v="${i+1}" aria-pressed="${S.survey[q.k]===i+1}" title="${l}">${i+1}</button>`).join("")}</div>
      <div class="lk-ends"><span>Strongly disagree</span><span>Strongly agree</span></div></div>`;
  });
  h += `<div class="field"><span>In a sentence or two: how did you decide what to check?</span><textarea id="open">${esc(S.open||"")}</textarea></div>
    <button class="primary" id="finish" ${qs.every(q=>S.survey[q.k])?"":"disabled"}>Finish and see the results</button></div>`;
  return h;
}

/* ---------- Metrics and export ---------- */
function metrics(){
  const all = Object.values(CLAIMS).filter(c=>S.dec[c.id]&&S.dec[c.id].d);
  const errs = all.filter(c=>c.err), oks = all.filter(c=>!c.err);
  const D = c=>S.dec[c.id].d;
  const rate = (arr,f)=>arr.length? +(arr.filter(f).length/arr.length).toFixed(3) : null;
  const attn = c=>D(c)==="wrong"||D(c)==="check_later"||D(c)==="check_now";
  const hiErr = errs.filter(c=>c.c>=85), loErr = errs.filter(c=>c.c<70);
  return {
    errors_total: errs.length,
    errors_marked_wrong: errs.filter(c=>D(c)==="wrong").length,
    errors_marked_wrong_or_check: errs.filter(attn).length,
    errors_accepted: errs.filter(c=>D(c)==="accept").length,
    errors_check_later: errs.filter(c=>D(c)==="check_later").length,
    errors_check_now: errs.filter(c=>D(c)==="check_now").length,
    errors_checked_now_then_judged_wrong: errs.filter(c=>D(c)==="check_now" && S.dec[c.id].after==="wrong").length,
    errors_checked_now_then_judged_correct: errs.filter(c=>D(c)==="check_now" && S.dec[c.id].after==="correct").length,
    high_conf_errors_total: hiErr.length,
    high_conf_errors_accepted: hiErr.filter(c=>D(c)==="accept").length,
    high_conf_errors_attention_rate: rate(hiErr,attn),
    low_conf_errors_attention_rate: rate(loErr,attn),
    correct_claims_flagged_wrong: oks.filter(c=>D(c)==="wrong").length,
    attention_rate_correct_high: rate(oks.filter(c=>c.c>=85),attn),
    attention_rate_correct_low: rate(oks.filter(c=>c.c<70),attn)
  };
}
function buildJSON(){
  const claims = TOPICS.flatMap(T=>T.claims.map((cl,pos)=>{
    const c = CLAIMS[cl.id], d = S.dec[cl.id]||{};
    return { claim_id:c.id, topic:T.id, display_position:pos+1, is_error:c.err, confidence_pct:c.c,
      confidence_tier:tier(c.c), label_shown: S.cond==="A"?"none": S.cond==="B"? c.c+"%" : tierName[tier(c.c)],
      familiarity_topic:S.fam[T.id]??null, decision:d.d??null, decision_changes:d.n??0, first_decision_ms:d.first??null,
      google_clicks:d.links??0,
      after_check_verdict:(d.d==="check_now"? (d.after??null) : null),
      read_time_ms:(S.tJudge[T.id]&&S.tStart[T.id])? S.tJudge[T.id]-S.tStart[T.id] : null,
      judge_time_ms:(S.tEnd[T.id]&&S.tJudge[T.id])? S.tEnd[T.id]-S.tJudge[T.id] : null };
  }));
  return { study:"ai-answer-review-v2", submission_id:S.submissionId, participant_id:S.pid, condition:S.cond, ai_use_coursework:USAGE[S.usage]??null,
    started_at:S.startedAt, finished_at:S.finishedAt, survey:S.survey, survey_open_text:S.open, metrics:metrics(), claims };
}
function toCSV(obj){
  const rows = obj.claims, cols = ["participant_id","condition","ai_use_coursework",...Object.keys(rows[0]||{})];
  const q = v => { if(v===null||v===undefined) return ""; const s=String(v); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [cols.join(","), ...rows.map(r=>cols.map(k=> k==="participant_id"?q(obj.participant_id): k==="condition"?q(obj.condition): k==="ai_use_coursework"?q(obj.ai_use_coursework): q(r[k])).join(","))].join("\n");
}

function screenDone(){
  const m = metrics(), json = JSON.stringify(buildJSON(), null, 2);
  let h = `<h1>Thank you</h1>
  <p class="muted">Here is what was going on, and how you did.</p>
  <div class="panel"><h2>Your decisions on the wrong sentences</h2>
    <div class="stat">
      <div><b>${m.errors_marked_wrong} of ${m.errors_total}</b>marked as wrong</div>
      <div><b>${m.errors_marked_wrong_or_check-m.errors_marked_wrong}</b>marked "would check"</div>
      <div><b>${m.errors_accepted}</b>accepted as is</div>
    </div>
    <p class="small muted">Six sentences were deliberately incorrect, two per question. Some had a high confidence label and some a low one, and the labels were written by the researchers, not calculated by an AI.</p>`;
  TOPICS.forEach(T=>T.claims.filter(c=>c.err).forEach(c=>{
    const d = (S.dec[c.id]||{}).d;
    const dl = DECS.find(o=>o.k===d);
    h += `<div class="err-item"><p class="ctext">${esc(c.t)}</p><p class="small">${esc(c.fix)}</p>
      <span class="badge">${T.label}</span>
      ${S.cond!=="A"?`<span class="badge">Label shown: ${S.cond==="B"?c.c+"%":tierName[tier(c.c)]}</span>`:""}
      <span class="badge ${d==="accept"?"bad":"good"}">You chose: ${dl?dl.l:"none"}</span></div>`;
  }));
  h += `</div>
  ${ENDPOINT ? `<div class="panel"><h2>Sending your results</h2>
    <div class="notice" id="sendstatus" aria-live="polite" style="font-size:.95rem;color:var(--ink)"></div>
    <div class="btnrow"><button class="ghost" id="retry" hidden>Try sending again</button></div></div>` : ""}
  <div class="panel"><h2>${ENDPOINT ? "Backup copy (optional)" : "Save your results"}</h2>
    <p class="small">${ENDPOINT ? "You can also save a copy of your results. It contains your ID, your decisions and your feedback, and nothing else." : "Save the file and send it to the researcher. It contains your ID, your decisions and your feedback, and nothing else."}</p>
    <div class="btnrow">
      <button class="primary" id="dlCsv">Save decisions (CSV)</button>
      <button class="ghost" id="dlJson">Save everything (JSON)</button>
      <button class="ghost" id="cpJson">Copy as text</button>
    </div>
    <div class="notice" id="note" aria-live="polite"></div>
    <textarea class="export" id="exp" readonly aria-label="Results as text">${esc(json)}</textarea>
    <p class="small muted">If saving is not available on your device, use "Copy as text" and paste the text into a message to the researcher.</p>
  </div>`;
  return h;
}

/* ---------- Render + events ---------- */
function render(){
  let h = "";
  if(S.stage==="intro") h = screenIntro();
  else { h = progressBar();
    if(S.stage==="topic") h += S.phase==="fam" ? screenFam() : S.phase==="read" ? screenRead() : screenJudge();
    else if(S.stage==="survey") h += screenSurvey();
    else h += screenDone();
  }
  h += `<p style="margin-top:28px"><button class="link" id="reset">${S.resetArm?"Click again to erase all progress":"Restart (researcher)"}</button></p>`;
  $app.innerHTML = h; save(); wire(); window.scrollTo({top:0});
}
function keepScroll(){ const y=window.scrollY; render(); window.scrollTo({top:y}); }
function on(sel,fn){ document.querySelectorAll(sel).forEach(fn); }
function wire(){
  const $ = id=>document.getElementById(id);
  $("reset").onclick = ()=>{
    if(S.resetArm){ S = fresh(); try{localStorage.removeItem(KEY);}catch(e){} render(); }
    else { S.resetArm = true; render(); setTimeout(()=>{ if(S.resetArm){ S.resetArm=false; const b=document.getElementById("reset"); if(b) b.textContent="Restart (researcher)"; } },4000); }
  };
  if(S.stage==="intro"){
    $("consent").onchange = e=>{ S.consent=e.target.checked; keepScroll(); };
    on("[data-u]", b=>b.onclick=()=>{ S.usage=+b.dataset.u; keepScroll(); });
    $("pid").oninput = e=>{ S.pid = e.target.value.trim()||S.pid; save(); };
    $("start").onclick = ()=>{
      S.cond = FIXED_COND;
      S.startedAt = new Date().toISOString(); S.stage="topic"; S.ti=0; S.phase="fam"; render();
    };
    return;
  }
  if(S.stage==="topic"){
    const T = TOPICS[S.ti];
    if(S.phase==="fam"){
      on("[data-f]", b=>b.onclick=()=>{ S.fam[T.id]=+b.dataset.f; keepScroll(); });
      $("seeAns").onclick = ()=>{ S.tStart[T.id]=Date.now(); S.phase="read"; render(); };
    } else if(S.phase==="read"){
      $("startJudge").onclick = ()=>{ S.tJudge[T.id]=Date.now(); S.phase="judge"; render(); };
    } else {
      on("[data-c]", b=>b.onclick=()=>{
        const id=b.dataset.c, d=b.dataset.d, cur=S.dec[id]||{n:0};
        if(cur.d && cur.d!==d) cur.n=(cur.n||0)+1;
        if(!cur.d) cur.first = Date.now()-S.tJudge[T.id];
        cur.d=d; S.dec[id]=cur;
        if(d==="check_now") cur.links=(cur.links||0)+1;   // the link itself opens Google; we only count the click
        setTimeout(keepScroll,0);                          // re-render after the browser has started the navigation
      });
      on("[data-copy]", b=>b.onclick=async ()=>{
        const id=b.dataset.copy, el=document.getElementById("cp-"+id);
        try{ await navigator.clipboard.writeText(CLAIMS[id].t); el.textContent="Copied."; }
        catch(e){ el.textContent="Could not copy. Select the sentence above and copy it."; }
      });
      on("[data-a]", b=>b.onclick=()=>{ S.dec[b.dataset.a].after=b.dataset.v; keepScroll(); });
      on("[data-g]", a=>a.addEventListener("click",()=>{ const d=S.dec[a.dataset.g]; d.links=(d.links||0)+1; save(); }));
      $("nextQ").onclick = ()=>{
        S.tEnd[T.id]=Date.now();
        if(S.ti<TOPICS.length-1){ S.ti++; S.phase="fam"; } else { S.stage="survey"; }
        render();
      };
    }
    return;
  }
  if(S.stage==="survey"){
    on("[data-s]", b=>b.onclick=()=>{ S.survey[b.dataset.s]=+b.dataset.v; keepScroll(); });
    $("open").oninput = e=>{ S.open=e.target.value; save(); };
    $("finish").onclick = ()=>{ S.finishedAt=new Date().toISOString(); S.submissionId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2)); S.stage="done"; render(); };
    return;
  }
  if(S.stage==="done"){
    if(ENDPOINT){
      const rb=document.getElementById("retry"); if(rb) rb.onclick=()=>submitResults();
      if(S.submit==="idle"||S.submit==="sending") submitResults(); else showStatus();
    }
    const note = t=>{ $("note").textContent=t; };
    const stamp = ()=>S.pid.replace(/[^A-Za-z0-9_-]/g,"");
    const saveFile = async (name,data)=>{
      try{
        if(!window.claude){   // hosted outside Claude: normal browser download
          const a=document.createElement("a");
          a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"})); a.download=name;
          document.body.appendChild(a); a.click(); a.remove();
          note("Saved to your downloads. Send the file to the researcher."); return;
        }
        const dl = window.claude.use ? await window.claude.use("downloads") : null;
        if(!dl){ note("Saving is not available here. Use “Copy as text” instead."); return; }
        await dl.save({filename:name, data});
        note("Saved. Send the file to the researcher.");
      }catch(e){
        note(e && e.code==="declined" ? "Save cancelled." : "Saving did not work here. Use “Copy as text” instead.");
      }
    };
    $("dlCsv").onclick = ()=>saveFile(`study_${stamp()}_decisions.csv`, toCSV(buildJSON()));
    $("dlJson").onclick = ()=>saveFile(`study_${stamp()}_full.json`, JSON.stringify(buildJSON(),null,2));
    $("cpJson").onclick = async ()=>{
      const ta=$("exp");
      try{ await navigator.clipboard.writeText(ta.value); note("Copied."); }
      catch(e){ ta.focus(); ta.select(); note("Text selected. Copy it with your keyboard or the share menu."); }
    };
  }
}
function dataNote(){
  const c = CONTACT ? " "+esc(CONTACT) : "";
  return ENDPOINT
    ? "When you finish, your participant ID, your choice for each sentence and your feedback are sent automatically to the researcher's Google Sheet. No name, email or other personal details are collected."+c
    : "Nothing is sent anywhere automatically: at the end you can save a results file and give it to the researcher."+c;
}
function showStatus(){
  const el=document.getElementById("sendstatus"), rb=document.getElementById("retry"); if(!el) return;
  const T={idle:"",sending:"Sending your results…",
    ok:"Your results were submitted. Thank you, you do not need to do anything else.",
    unconfirmed:"Your results were sent, but this browser could not confirm it. To be safe, please also save the backup copy below and send it to the researcher.",
    failed:"Your results could not be sent. Please save the backup copy below and send it to the researcher, or try again."};
  el.textContent = T[S.submit]||""; if(rb) rb.hidden = S.submit!=="failed";
}
async function submitResults(){
  if(!ENDPOINT) return;
  S.submit="sending"; save(); showStatus();
  const body = JSON.stringify(buildJSON());
  const headers = {"Content-Type":"text/plain;charset=utf-8"};   // plain text avoids a browser pre-flight request
  try{
    const r = await fetch(ENDPOINT,{method:"POST",headers,body,redirect:"follow"});
    const j = await r.json();
    S.submit = (j && j.ok) ? "ok" : "failed";
  }catch(e){
    try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers,body}); S.submit="unconfirmed"; }   // sent, but the reply cannot be read
    catch(e2){ S.submit="failed"; }
  }
  save(); showStatus();
}
render();
</script>
